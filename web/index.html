<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AppStroke">
  <meta name="theme-color" content="#0175C2">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AppStroke">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AppStroke</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <button id="install-app" hidden style="position:fixed;bottom:16px;left:16px;z-index:9999;background:#0175C2;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer">نصب برنامه</button>
  <script>
    window.showAppStrokeNotification = async function(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const registration = registrations.find(function(item) {
          return item.active && item.active.scriptURL.includes('firebase-messaging-sw.js');
        });
        if (registration) {
          await registration.showNotification(title, {
            body: body,
            icon: new URL('icons/Icon-192.png', document.baseURI).href
          });
        } else {
          const notification = new Notification(title, {
            body: body,
            icon: new URL('icons/Icon-192.png', document.baseURI).href
          });
          notification.onclick = function() {
            window.focus();
            notification.close();
          };
        }
      } catch (error) {
        console.error('Unable to display notification', error);
      }
    };

    let installPrompt;
    const installButton = document.getElementById('install-app');
    window.addEventListener('beforeinstallprompt', function(event) {
      event.preventDefault();
      installPrompt = event;
      installButton.hidden = false;
    });
    installButton.addEventListener('click', async function() {
      if (!installPrompt) return;
      await installPrompt.prompt();
      installPrompt = null;
      installButton.hidden = true;
    });
    window.addEventListener('appinstalled', function() {
      installPrompt = null;
      installButton.hidden = true;
    });
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
